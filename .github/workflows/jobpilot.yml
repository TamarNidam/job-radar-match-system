name: JobPilot Scraper

on:
  schedule:
    # Runs at minute 0 past every 5th hour.
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write # Required to push the updated config file back to the repo

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main.py
        run: python JobPilot/main.py

      - name: Commit updated lastRun_config.json
        # This step saves the new timestamp back to your repo so it doesn't fetch duplicate jobs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add JobPilot/lastRun_config.json
          # Only commit and push if there are actual changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update last run timestamp" && git push)
